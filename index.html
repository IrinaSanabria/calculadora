<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora de Insulina</title>

<link href="https://fonts.googleapis.com/css2?family=Forum&family=Questrial&display=swap" rel="stylesheet">

<style>
:root{
--bg:#f4ede6;
--card:#fffaf4;
--primary:#8b6f54;
--accent:#b79b7f;
--text:#4a3a2a;
--shadow:0 10px 24px rgba(0,0,0,0.08);
}

body{
margin:0;
background:var(--bg);
font-family:'Questrial',sans-serif;
color:var(--text);
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.container{
width:92%;
max-width:430px;
}

h1{
font-family:'Forum',serif;
text-align:center;
font-size:30px;
margin-bottom:18px;
color:var(--primary);
}

.card{
background:var(--card);
border-radius:22px;
padding:22px;
box-shadow:var(--shadow);
}

.field{
margin-bottom:14px;
}

label{
font-size:13px;
display:block;
margin-bottom:5px;
color:var(--primary);
}

input{
width:100%;
padding:14px;
border-radius:14px;
border:none;
background:#f1e8df;
font-size:16px;
outline:none;
}

.chips{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:6px;
}

.chip{
padding:10px 12px;
border-radius:20px;
background:#f1e8df;
font-size:13px;
cursor:pointer;
transition:0.2s;
}

.chip.active{
background:var(--primary);
color:#fff;
}

button{
width:100%;
margin-top:12px;
padding:16px;
border:none;
border-radius:18px;
font-size:16px;
background:var(--primary);
color:white;
cursor:pointer;
font-family:'Questrial',sans-serif;
}

.result{
margin-top:20px;
background:#f8f1ea;
padding:18px;
border-radius:18px;
font-size:15px;
line-height:1.7;
display:none;
animation:fadeIn .4s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

footer{
text-align:center;
margin-top:16px;
font-size:12px;
color:#7b5f46;
}
</style>
</head>

<body>

<div class="container">

<h1>Calculadora de Insulina🤎💉</h1>

<div class="card">

<div class="field">
<label>Glucosa actual (mg/dL)</label>
<input id="glucose" type="number" inputmode="decimal">
</div>

<div class="field">
<label>Carbohidratos (g)</label>
<input id="carbs" type="number" step="0.1" inputmode="decimal">
</div>

<div class="field">
<label>Grasas (g)</label>
<input id="fat" type="number" step="0.1" inputmode="decimal">
</div>

<div class="field">
<label>Proteínas (g)</label>
<input id="protein" type="number" step="0.1" inputmode="decimal">
</div>

<div class="field">
<label>Tendencia</label>

<div class="chips">

<div class="chip active" data-value="stable">➡️</div>
<div class="chip" data-value="upSlow">↗️</div>
<div class="chip" data-value="upFast">⬆️📈</div>
<div class="chip" data-value="downSlow">↘️</div>
<div class="chip" data-value="downFast">⬇️📉</div>

</div>
</div>

<button onclick="calculate()">Calcular</button>

<div id="result" class="result"></div>

</div>

<footer>
de mi para mi 🤎<br>
ⒾⓅⓈ
</footer>

</div>

<script>

/* =========================
CONFIG
========================= */

const target = 90;
const correctionFactor = 40;
const insulinDuration = 4;

/* =========================
RATIO
========================= */

function getRatio(){

const h = new Date().getHours();

if(h >= 7 && h < 10) return 6;
if(h >= 12 && h < 15) return 7;
if(h >= 18 && h < 22) return 7;

return 7;

}

/* =========================
TREND
========================= */

function getTrend(){

return document.querySelector(".chip.active").dataset.value;

}

function adjustCorrection(correction,trend){

switch(trend){

case "upFast":
return correction * 1.15;

case "upSlow":
return correction * 1.10;

case "downSlow":
return correction * 0.90;

case "downFast":
return correction * 0.80;

default:
return correction;

}

}

/* =========================
PREBOLUS
========================= */

function getPrebolus(glucose,trend){

let base = 0;

if(glucose >= 90 && glucose <= 120){
base = 10;
}
else if(glucose <= 180){
base = 15;
}
else if(glucose <= 220){
base = 20;
}
else if(glucose > 220){
base = 25;
}

if(trend === "upFast" || trend === "upSlow"){
base += 5;
}

if(trend === "downFast" || trend === "downSlow"){
base -= 5;
}

return Math.max(base,0) + " min";

}

/* =========================
FORMATO HORA
========================= */

function formatTime(date){

const h = date.getHours().toString().padStart(2,"0");
const m = date.getMinutes().toString().padStart(2,"0");

return `${h}:${m}`;

}

/* =========================
IOB INFORMATIVO
========================= */

function getActiveInsulin(){

const history = JSON.parse(localStorage.getItem("iobHistory") || "[]");

let active = 0;

const now = Date.now();

history.forEach(entry=>{

const elapsed = (now - entry.time) / 3600000;

if(elapsed < insulinDuration){

const remaining = 1 - (elapsed / insulinDuration);

active += entry.units * remaining;

}

});

return active;

}

function saveCorrection(correction){

if(correction <= 0) return;

let history = JSON.parse(localStorage.getItem("iobHistory") || "[]");

history.push({
units:correction,
time:Date.now()
});

localStorage.setItem("iobHistory",JSON.stringify(history));

}

/* =========================
BOLO PENDIENTE
========================= */

function getPendingBolus(){

const pending = JSON.parse(localStorage.getItem("pendingBolus") || "null");

if(!pending) return 0;

const now = Date.now();

const elapsed = now - pending.time;

const totalTime = 90 * 60000;

if(elapsed >= totalTime){

localStorage.removeItem("pendingBolus");

return 0;

}

const remainingRatio = 1 - (elapsed / totalTime);

return pending.units * remainingRatio;

}

function savePendingBolus(units){

localStorage.setItem("pendingBolus",JSON.stringify({
units:units,
time:Date.now()
}));

}

/* =========================
PERSISTENCIA
========================= */

function saveInputs(){

localStorage.setItem("inputs",JSON.stringify({

glucose:glucose.value,
carbs:carbs.value,
fat:fat.value,
protein:protein.value,
trend:getTrend()

}));

}

function loadInputs(){

const data = JSON.parse(localStorage.getItem("inputs") || "null");

if(!data) return;

glucose.value = data.glucose;
carbs.value = data.carbs;
fat.value = data.fat;
protein.value = data.protein;

document.querySelectorAll(".chip").forEach(chip=>{

chip.classList.remove("active");

if(chip.dataset.value === data.trend){

chip.classList.add("active");

}

});

}

/* =========================
CALCULO
========================= */

function calculate(){

const glucoseValue = parseFloat(glucose.value) || 0;
const carbsValue = parseFloat(carbs.value) || 0;
const fatValue = parseFloat(fat.value) || 0;
const proteinValue = parseFloat(protein.value) || 0;

const trend = getTrend();

const ratio = getRatio();

/* FPU */

const fpu = ((fatValue * 9) + (proteinValue * 4)) / 100;

const fpuInsulin = fpu * 0.5;

/* CARBS */

const insulinCarbs = (carbsValue / ratio) + fpuInsulin;

/* CORRECCION */

let correction = 0;

if(glucoseValue > target){

correction = (glucoseValue - target) / correctionFactor;

correction = adjustCorrection(correction,trend);

}

/* BOLO PENDIENTE */

const pendingBolus = getPendingBolus();

/* TOTAL */

const total = insulinCarbs + correction + pendingBolus;

/* PREBOLUS */

const prebolus = getPrebolus(glucoseValue,trend);

/* INSULINA ACTIVA */

const activeInsulin = getActiveInsulin();

/* MENSAJES */

let warnings = "";

/* HIPO */

if(glucoseValue < 70){

const neededCarbs = ((target - glucoseValue) / correctionFactor) * ratio;

warnings += `
⚠️ <b>Glucosa baja</b><br>
Consumir aproximadamente <b>${neededCarbs.toFixed(1)} g</b> de carbohidratos antes de corregir.<br>
Luego considerar aplicar únicamente la corrección correspondiente.<br><br>
`;

}

/* HIPER */

if(glucoseValue > 250){

warnings += `
⚠️ <b>Glucosa muy alta</b><br>
Considerar corregir y esperar antes de comenzar a comer.<br><br>
`;

}

/* RESULTADO */

let html = `

🍞 <b>Insulina por carbohidratos:</b> ${insulinCarbs.toFixed(2)} U<br>

🩸 <b>Corrección:</b> ${correction.toFixed(2)} U<br>

💉 <b>Dosis total:</b> ${total.toFixed(2)} U<br>

⏱️ <b>Pre-bolus recomendado:</b> ${prebolus}<br>

`;

/* INSULINA ACTIVA */

if(activeInsulin > 0.1){

html += `
<br>
✨ <b>Insulina que seguiría activa:</b> ${activeInsulin.toFixed(2)} U<br>
`;

}

/* COMIDA GRASA */

if(fpu > 1){

const nowDose = total * 0.7;

const laterDose = total * 0.3;

const laterTime = new Date(Date.now() + (90 * 60000));

html += `

<br>

🥑 <b>Comida alta en grasa</b><br>

💉 <b>Aplicar ahora:</b> ${nowDose.toFixed(2)} U<br>

💉 <b>Bolo extra:</b> ${laterDose.toFixed(2)} U a las ${formatTime(laterTime)}<br>

`;

savePendingBolus(laterDose);

}else{

html += `

<br>

💉 <b>Aplicar ahora:</b> ${total.toFixed(2)} U

`;

}

/* MOSTRAR */

result.innerHTML = warnings + html;

result.style.display = "block";

result.scrollIntoView({
behavior:"smooth"
});

/* GUARDAR */

saveCorrection(correction);

saveInputs();

/* HAPTIC */

if(navigator.vibrate){

navigator.vibrate(20);

}

}

/* =========================
UI
========================= */

document.querySelectorAll(".chip").forEach(chip=>{

chip.addEventListener("click",()=>{

document.querySelectorAll(".chip").forEach(c=>{
c.classList.remove("active");
});

chip.classList.add("active");

});

});

loadInputs();

</script>

</body>
</html>
