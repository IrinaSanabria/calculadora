<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora de Insulina</title>

<link href="https://fonts.googleapis.com/css2?family=Forum&family=Questrial&display=swap" rel="stylesheet">

<style>

:root{
--bg:#f4ede6;
--card:rgba(255,250,244,0.78);
--primary:#8b6f54;
--accent:#b79b7f;
--text:#4a3a2a;
--shadow:0 10px 30px rgba(0,0,0,0.08);
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{
margin:0;
background:linear-gradient(to bottom,#f5eee7,#efe4d9);
font-family:'Questrial',sans-serif;
color:var(--text);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px 0;
}

.container{
width:92%;
max-width:430px;
}

h1{
font-family:'Forum',serif;
text-align:center;
font-size:31px;
margin-bottom:18px;
color:var(--primary);
letter-spacing:0.5px;
}

.card{
background:var(--card);
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
border-radius:28px;
padding:22px;
box-shadow:var(--shadow);
border:1px solid rgba(255,255,255,0.4);
}

.field{
margin-bottom:15px;
}

label{
display:block;
margin-bottom:6px;
font-size:13px;
color:var(--primary);
}

input{
width:100%;
padding:15px;
border:none;
border-radius:16px;
background:#f2e9e1;
font-size:16px;
outline:none;
font-family:'Questrial',sans-serif;
color:var(--text);
transition:0.2s;
}

input:focus{
transform:scale(1.01);
background:#efe4da;
}

.chips{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:8px;
}

.chip{
padding:10px 14px;
border-radius:20px;
background:#f1e8df;
font-size:14px;
cursor:pointer;
transition:0.18s ease;
user-select:none;
}

.chip:active{
transform:scale(0.96);
}

.chip.active{
background:var(--primary);
color:white;
box-shadow:0 4px 12px rgba(139,111,84,0.25);
}

button{
width:100%;
padding:17px;
border:none;
border-radius:20px;
margin-top:12px;
font-size:16px;
font-family:'Questrial',sans-serif;
background:var(--primary);
color:white;
cursor:pointer;
transition:0.2s ease;
box-shadow:0 6px 18px rgba(139,111,84,0.25);
}

button:active{
transform:scale(0.98);
}

.result{
margin-top:20px;
background:rgba(248,241,234,0.95);
padding:20px;
border-radius:22px;
font-size:15px;
line-height:1.7;
display:none;
animation:fadeIn 0.35s ease;
border:1px solid rgba(255,255,255,0.4);
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(10px);
}
to{
opacity:1;
transform:translateY(0);
}
}

footer{
text-align:center;
margin-top:18px;
font-size:12px;
color:#7b5f46;
line-height:1.5;
}

b{
color:#5e4632;
}

.section{
margin-top:12px;
padding-top:12px;
border-top:1px solid rgba(139,111,84,0.12);
}

</style>
</head>

<body>

<div class="container">

<h1>Calculadora de Insulina🤎💉</h1>

<div class="card">

<div class="field">
<label>Glucosa actual (mg/dL)</label>
<input id="glucose" type="number" inputmode="decimal">
</div>

<div class="field">
<label>Carbohidratos (g)</label>
<input id="carbs" type="number" step="0.1" inputmode="decimal">
</div>

<div class="field">
<label>Grasas (g)</label>
<input id="fat" type="number" step="0.1" inputmode="decimal">
</div>

<div class="field">
<label>Proteínas (g)</label>
<input id="protein" type="number" step="0.1" inputmode="decimal">
</div>

<div class="field">
<label>Tendencia</label>

<div class="chips">

<div class="chip active" data-value="stable">➡️</div>

<div class="chip" data-value="upSlow">↗️</div>

<div class="chip" data-value="upFast">⬆️</div>

<div class="chip" data-value="downSlow">↘️</div>

<div class="chip" data-value="downFast">⬇️</div>

</div>

</div>

<button onclick="calculate()">Calcular</button>

<div class="result" id="result"></div>

</div>

<footer>
de mi para mi 🤎<br>
ⒾⓅⓈ
</footer>

</div>

<script>

/* =========================
   CONFIG
========================= */

const TARGET = 90;
const CORRECTION_FACTOR = 40;

/* =========================
   CHIPS
========================= */

document.querySelectorAll(".chip").forEach(chip=>{

chip.addEventListener("click",()=>{

document.querySelectorAll(".chip").forEach(c=>{
c.classList.remove("active");
});

chip.classList.add("active");

});

});

/* =========================
   PERSISTENCIA
========================= */

function saveInputs(){

localStorage.setItem("insulinCalcInputs",JSON.stringify({

glucose:glucose.value,
carbs:carbs.value,
fat:fat.value,
protein:protein.value,
trend:getTrend()

}));

}

function loadInputs(){

const saved = JSON.parse(localStorage.getItem("insulinCalcInputs") || "null");

if(!saved) return;

glucose.value = saved.glucose || "";
carbs.value = saved.carbs || "";
fat.value = saved.fat || "";
protein.value = saved.protein || "";

document.querySelectorAll(".chip").forEach(chip=>{

chip.classList.remove("active");

if(chip.dataset.value === saved.trend){
chip.classList.add("active");
}

});

}

loadInputs();

/* =========================
   HELPERS
========================= */

function getTrend(){

return document.querySelector(".chip.active").dataset.value;

}

function getRatio(){

const h = new Date().getHours();

if(h>=7 && h<10) return 6;

if(h>=12 && h<15) return 7;

if(h>=18 && h<22) return 7;

return 7;

}

function formatTime(date){

return date.getHours().toString().padStart(2,"0")
+ ":"
+ date.getMinutes().toString().padStart(2,"0");

}

/* =========================
   PREBOLUS
========================= */

function getPrebolus(glucose,trend){

let min = 0;

if(glucose>=90 && glucose<=120){
min = 10;
}

else if(glucose<=180){
min = 15;
}

else if(glucose<=220){
min = 20;
}

else if(glucose>220){
min = 25;
}

if(trend==="upFast" || trend==="upSlow"){
min +=5;
}

if(trend==="downFast" || trend==="downSlow"){
min -=5;
}

return Math.max(min,0);

}

/* =========================
   REDONDEO INTELIGENTE
========================= */

function smartRound(value,trend){

if(trend==="upFast"){
return Math.ceil(value);
}

if(trend==="upSlow"){

if(value % 1 >=0.3){
return Math.ceil(value);
}

return Math.floor(value);

}

if(trend==="downFast"){
return Math.floor(value);
}

if(trend==="downSlow"){

if(value % 1 >=0.8){
return Math.ceil(value);
}

return Math.floor(value);

}

/* estable */

return Math.round(value);

}

/* =========================
   CALCULO
========================= */

function calculate(){

const glucoseValue = parseFloat(glucose.value) || 0;
const carbsValue = parseFloat(carbs.value) || 0;
const fatValue = parseFloat(fat.value) || 0;
const proteinValue = parseFloat(protein.value) || 0;

const trend = getTrend();

const ratio = getRatio();

/* =========================
   FPU
========================= */

const caloriesFat = fatValue * 9;
const caloriesProtein = proteinValue * 4;

const fpu = (caloriesFat + caloriesProtein) / 100;

const fpuInsulin = fpu * 0.5;

/* =========================
   CARBS
========================= */

const carbInsulin = (carbsValue / ratio) + fpuInsulin;

/* =========================
   CORRECCION
========================= */

let correction = 0;

if(glucoseValue > TARGET){

correction = (glucoseValue - TARGET) / CORRECTION_FACTOR;

}

/* =========================
   PROTECCION ANTI HIPO
========================= */

if(glucoseValue <110){

if(trend==="downSlow"){
correction *=0.5;
}

if(trend==="downFast"){
correction = 0;
}

}

/* =========================
   AJUSTE TENDENCIA
========================= */

if(trend==="upFast"){
correction *=1.15;
}

if(trend==="upSlow"){
correction *=1.10;
}

if(trend==="downSlow"){
correction *=0.90;
}

if(trend==="downFast"){
correction *=0.80;
}

/* =========================
   REDONDEAR
========================= */

const roundedCorrection = smartRound(correction,trend);

/* =========================
   TOTAL
========================= */

const total = carbInsulin + roundedCorrection;

const roundedTotal = smartRound(total,trend);

/* =========================
   PREBOLUS
========================= */

const prebolus = getPrebolus(glucoseValue,trend);

/* =========================
   RESULTADO
========================= */

let html = "";

/* =========================
   HIPO
========================= */

if(glucoseValue <70){

const neededCarbs = ((TARGET - glucoseValue) / CORRECTION_FACTOR) * ratio;

const futureTime = new Date(Date.now() + 15*60000);

html += `
⚠️ <b>Glucosa baja</b><br>

🍬 Consumir primero <b>${neededCarbs.toFixed(1)} g</b> de carbohidratos rápidos.<br>

💉 Luego aplicar <b>${roundedTotal} U</b> para la comida aproximadamente a las <b>${formatTime(futureTime)}</b>.<br>

<div class="section"></div>
`;

}

/* =========================
   HIPER
========================= */

if(glucoseValue >250){

html += `
⚠️ <b>Glucosa muy alta</b><br>

🩸 Considerar corregir y esperar antes de comenzar a comer.<br>

<div class="section"></div>
`;

}

/* =========================
   RESULTADO BASE
========================= */

html += `

🍞 <b>Insulina por carbohidratos:</b> ${carbInsulin.toFixed(2)} U<br>

🩸 <b>Corrección sugerida:</b> ${roundedCorrection} U<br>

💉 <b>Dosis sugerida:</b> ${roundedTotal} U<br>

⏱️ <b>Pre-bolus recomendado:</b> ${prebolus} min<br>

`;

/* =========================
   COMIDA GRASA
========================= */

if(fpu > 1){

const nowDose = smartRound(total * 0.7,trend);

const laterDose = smartRound(total * 0.3,trend);

const laterTime = new Date(Date.now() + 90*60000);

html += `

<div class="section">

🥑 <b>Comida alta en grasa</b><br>

💉 Ahora: <b>${nowDose} U</b><br>

💉 Después: <b>${laterDose} U</b> a las <b>${formatTime(laterTime)}</b><br>

</div>

`;

}

/* =========================
   RECOMENDACION
========================= */

let recommendation = "";

if(trend==="upFast"){
recommendation = "La glucosa está subiendo rápido.";
}

if(trend==="upSlow"){
recommendation = "La glucosa está subiendo lentamente.";
}

if(trend==="stable"){
recommendation = "La glucosa parece estable.";
}

if(trend==="downSlow"){
recommendation = "La glucosa está bajando lentamente.";
}

if(trend==="downFast"){
recommendation = "La glucosa está bajando rápido.";
}

html += `

<div class="section">

✨ <b>Recomendación:</b> ${recommendation}

</div>

`;

/* =========================
   MOSTRAR
========================= */

result.innerHTML = html;

result.style.display = "block";

result.scrollIntoView({
behavior:"smooth"
});

/* =========================
   GUARDAR
========================= */

saveInputs();

/* =========================
   HAPTIC
========================= */

if(navigator.vibrate){

navigator.vibrate(20);

}

}

</script>

</body>
</html>
