<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora de Insulina</title>

<link href="https://fonts.googleapis.com/css2?family=Forum&family=Questrial&display=swap" rel="stylesheet">

<style>
:root{
--bg:#f4ede6;
--card:#fffaf4;
--primary:#8b6f54;
--accent:#b79b7f;
--text:#4a3a2a;
--shadow:0 10px 24px rgba(0,0,0,0.08);
}

body{
margin:0;
background:var(--bg);
font-family:'Questrial',sans-serif;
color:var(--text);
display:flex;
align-items:center;
justify-content:center;
min-height:100vh;
}

.container{
width:92%;
max-width:430px;
}

h1{
font-family:'Forum',serif;
text-align:center;
font-size:30px;
margin-bottom:18px;
color:var(--primary);
}

.card{
background:var(--card);
border-radius:22px;
padding:22px;
box-shadow:var(--shadow);
}

.field{
margin-bottom:14px;
}

label{
font-size:13px;
display:block;
margin-bottom:5px;
color:var(--primary);
}

input{
width:100%;
padding:14px;
border-radius:14px;
border:none;
background:#f1e8df;
font-size:16px;
outline:none;
}

.chips{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:6px;
}

.chip{
padding:10px 12px;
border-radius:20px;
background:#f1e8df;
font-size:13px;
cursor:pointer;
}

.chip.active{
background:var(--primary);
color:#fff;
}

button{
width:100%;
margin-top:12px;
padding:16px;
border:none;
border-radius:18px;
font-size:16px;
background:var(--primary);
color:white;
cursor:pointer;
}

.result{
margin-top:20px;
background:#f8f1ea;
padding:18px;
border-radius:18px;
font-size:15px;
line-height:1.6;
display:none;
animation:fadeIn .4s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

footer{
text-align:center;
margin-top:16px;
font-size:12px;
color:#7b5f46;
}
</style>
</head>

<body>

<div class="container">

<h1>Calculadora de Insulina🤎💉</h1>

<div class="card">

<div class="field">
<label>Glucosa actual (mg/dL)</label>
<input id="glucose" type="number" inputmode="decimal">
</div>

<div class="field">
<label>Carbohidratos (g)</label>
<input id="carbs" type="number" step="0.1" inputmode="decimal">
</div>

<div class="field">
<label>Grasas (g)</label>
<input id="fat" type="number" step="0.1" inputmode="decimal">
</div>

<div class="field">
<label>Proteínas (g)</label>
<input id="protein" type="number" step="0.1" inputmode="decimal">
</div>

<div class="field">
<label>Tendencia</label>
<div class="chips" id="trendSelector">
<div class="chip active" data-value="stable">➡️</div>
<div class="chip" data-value="upSlow">↗️</div>
<div class="chip" data-value="upFast">⬆️</div>
<div class="chip" data-value="downSlow">↘️</div>
<div class="chip" data-value="downFast">⬇️</div>
</div>
</div>

<button onclick="calculate()">Calcular</button>

<div id="result" class="result"></div>

</div>

<footer>
de mi para mi 🤎<br>
ⒾⓅⓈ
</footer>

</div>

<script>

/* ================= CONFIG ================= */

const target = 90;
const correctionFactor = 40;
const insulinDuration = 4; // horas

/* ================= HELPERS ================= */

function getRatio(){
const h = new Date().getHours();
if(h>=7 && h<10) return 6;
if(h>=12 && h<15) return 7;
if(h>=18 && h<22) return 7;
return 7;
}

function getTrend(){
return document.querySelector(".chip.active").dataset.value;
}

function getTrendAdjustment(type,value){

switch(type){
case "upFast": return value * 1.15;
case "upSlow": return value * 1.10;
case "downSlow": return value * 0.90;
case "downFast": return value * 0.80;
default: return value;
}

}

function getPrebolus(glucose,trend){

let base = 0;

if(glucose>=90 && glucose<=120) base = 10;
else if(glucose<=180) base = 15;
else if(glucose<=220) base = 20;
else if(glucose>220) base = 25;

if(trend==="upFast" || trend==="upSlow") base +=5;
if(trend==="downFast" || trend==="downSlow") base -=5;

return Math.max(base,0)+" min";

}

function formatTime(date){
return date.getHours().toString().padStart(2,"0")+":"+date.getMinutes().toString().padStart(2,"0");
}

/* ================= IOB ================= */

function getIOB(){

const history = JSON.parse(localStorage.getItem("iobHistory")||"[]");
let iob = 0;
const now = Date.now();

history.forEach(entry=>{
const t = (now-entry.time)/3600000;
if(t<insulinDuration){
const remain = 1-(t/insulinDuration);
iob += entry.units * remain;
}
});

return iob;

}

function saveIOB(units){
let h = JSON.parse(localStorage.getItem("iobHistory")||"[]");
h.push({units:units,time:Date.now()});
localStorage.setItem("iobHistory",JSON.stringify(h));
}

/* ================= BOLO PENDIENTE ================= */

function getPendingBolus(){

const pending = JSON.parse(localStorage.getItem("pendingBolus")||"null");
if(!pending) return 0;

const now = Date.now();
const elapsed = now - pending.time;
const total = 90*60000;

if(elapsed>=total){
localStorage.removeItem("pendingBolus");
return 0;
}

const remainingRatio = 1 - (elapsed/total);
return pending.units * remainingRatio;

}

function savePendingBolus(units){
localStorage.setItem("pendingBolus",JSON.stringify({
units:units,
time:Date.now()
}));
}

/* ================= PERSISTENCIA ================= */

function saveInputs(){
localStorage.setItem("inputs",JSON.stringify({
glucose:glucose.value,
carbs:carbs.value,
fat:fat.value,
protein:protein.value,
trend:getTrend()
}));
}

function loadInputs(){
const data = JSON.parse(localStorage.getItem("inputs")||"null");
if(!data) return;

glucose.value = data.glucose;
carbs.value = data.carbs;
fat.value = data.fat;
protein.value = data.protein;

document.querySelectorAll(".chip").forEach(c=>{
c.classList.remove("active");
if(c.dataset.value===data.trend) c.classList.add("active");
});
}

/* ================= CALCULO ================= */

function calculate(){

const g = parseFloat(glucose.value)||0;
const c = parseFloat(carbs.value)||0;
const f = parseFloat(fat.value)||0;
const p = parseFloat(protein.value)||0;
const trend = getTrend();
const ratio = getRatio();

/* FPU */

const fpu = ((f*9)+(p*4))/100;
const fpuInsulin = fpu * 0.5;

/* CARBS */

let insulinCarbs = (c/ratio) + fpuInsulin;

/* CORRECCION */

let correction = 0;
if(g>target){
correction = (g-target)/correctionFactor;
correction = getTrendAdjustment(trend,correction);
}

/* RESTAR IOB SOLO A CORRECCION */

const iob = getIOB();
correction = Math.max(correction - iob,0);

/* SUMAR BOLO PENDIENTE */

const pending = getPendingBolus();

/* TOTAL */

let total = insulinCarbs + correction + pending;

/* PREBOLUS */

const pre = getPrebolus(g,trend);

/* MENSAJES */

let msg = "";

/* HIPO */

if(g<70){

const neededCarbs = ((target-g)/correctionFactor)*ratio;

msg += `⚠️ <b>Glucosa baja</b><br>
Consumir <b>${neededCarbs.toFixed(1)} g</b> de carbohidratos.<br>
Aplicar insulina luego de estabilizar.<br><br>`;

}

/* HIPER */

if(g>250){
msg += `⚠️ <b>Glucosa muy alta</b><br>
Considerar corregir antes de comer.<br><br>`;
}

/* RESULTADO BASE */

let html = `
🍞 <b>Insulina por carbohidratos:</b> ${insulinCarbs.toFixed(2)} U<br>
🩸 <b>Corrección:</b> ${correction.toFixed(2)} U<br>
💉 <b>Dosis total:</b> ${total.toFixed(2)} U<br>
⏱️ <b>Pre-bolus:</b> ${pre}<br>
`;

/* GRASA (trigger por FPU) */

if(fpu>1){

const nowDose = total * 0.7;
const laterDose = total * 0.3;

const laterTime = new Date(Date.now()+90*60000);

html += `<br>🥑 <b>Comida alta en grasa</b><br>
💉 Ahora: <b>${nowDose.toFixed(2)} U</b><br>
💉 Después: <b>${laterDose.toFixed(2)} U</b> a las ${formatTime(laterTime)}<br>`;

savePendingBolus(laterDose);

}else{

html += `<br>💉 Aplicar ahora: <b>${total.toFixed(2)} U</b>`;
}

/* SHOW */

result.innerHTML = msg + html;
result.style.display="block";
result.scrollIntoView({behavior:"smooth"});

/* GUARDAR */

saveIOB(total);
saveInputs();

/* HAPTIC */

if(navigator.vibrate) navigator.vibrate(20);

}

/* ================= UI ================= */

document.querySelectorAll(".chip").forEach(chip=>{
chip.addEventListener("click",()=>{
document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
chip.classList.add("active");
});
});

loadInputs();

</script>

</body>
</html>
